# Checks every push to main, then deploys it to the Droplet.
# Needs repository secrets: DROPLET_HOST, DROPLET_USER, DROPLET_SSH_KEY.
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

  deploy:
    needs: check
    runs-on: ubuntu-latest
    steps:
      # Plain ssh, so any failure is written out as an annotation that can be read without the log files.
      - name: Pull and rebuild on the Droplet
        env:
          HOST: ${{ secrets.DROPLET_HOST }}
          USER: ${{ secrets.DROPLET_USER }}
          KEY: ${{ secrets.DROPLET_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          # The key may be pasted as-is or as one base64 line (base64 -w0 ~/.ssh/gh_deploy), which survives copy-paste better.
          if printf '%s' "$KEY" | grep -q 'BEGIN'; then printf '%s\n' "$KEY" | tr -d '\r' > ~/.ssh/deploy
          else printf '%s' "$KEY" | tr -d ' \r\n' | base64 -d > ~/.ssh/deploy; fi
          chmod 600 ~/.ssh/deploy
          if ! ssh-keygen -y -f ~/.ssh/deploy > /dev/null 2> keyerr; then
            echo "::error::DROPLET_SSH_KEY is not a valid private key: $(tr '\n' ' ' < keyerr)"; exit 1
          fi
          ssh-keyscan -T 15 -H "$HOST" >> ~/.ssh/known_hosts 2>/dev/null || { echo "::error::Could not reach $HOST on port 22"; exit 1; }
          set +e
          ssh -i ~/.ssh/deploy -o BatchMode=yes -o ConnectTimeout=20 -o ServerAliveInterval=30 "$USER@$HOST" \
            'set -e; cd ~/scene-os; git pull --ff-only origin main; docker compose up -d --build; docker image prune -f' > out.txt 2>&1
          code=$?
          set -e
          tail -n 40 out.txt
          if [ $code -ne 0 ]; then
            echo "::error::Deploy on the Droplet failed (exit $code): $(tail -n 6 out.txt | tr '\n' ' ' | cut -c1-900)"; exit $code
          fi
      - name: Check the live site
        run: |
          for i in $(seq 1 20); do
            if curl -fsS https://143-244-128-63.sslip.io/api/healthz; then exit 0; fi
            sleep 6
          done
          echo "The site did not answer /api/healthz after the deploy" && exit 1