# One Droplet, five containers. Run from the repo root:  docker compose up -d --build
# MongoDB is expected to be DigitalOcean Managed MongoDB (set MONGODB_URI in .env).
# To run MongoDB on the same Droplet instead:  docker compose --profile localdb up -d --build
# and set MONGODB_URI=mongodb://mongo:27017/sceneos
services:
  api:
    build: { context: ., dockerfile: deploy/api.Dockerfile }
    env_file: .env
    environment: { NODE_ENV: production, REDIS_URL: redis://redis:6379 }
    depends_on: [redis]
    restart: unless-stopped

  worker:
    build: { context: ., dockerfile: deploy/api.Dockerfile }
    command: ["node", "dist/worker.js"]
    env_file: .env
    environment: { NODE_ENV: production, REDIS_URL: redis://redis:6379 }
    depends_on: [redis]
    restart: unless-stopped

  web:
    build: { context: ., dockerfile: deploy/web.Dockerfile, args: { API_URL: http://api:4000 } }
    depends_on: [api]
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes: [redis-data:/data]
    restart: unless-stopped

  nginx:
    image: nginx:1.27-alpine
    ports: ["80:80"]
    volumes: ["./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro"]
    depends_on: [web, api]
    restart: unless-stopped

  mongo:
    profiles: [localdb]
    image: mongo:7
    volumes: [mongo-data:/data/db]
    restart: unless-stopped

volumes:
  redis-data:
  mongo-data:
