# One Droplet, five containers. Run from the repo root:  docker compose up -d --build
# Set DOMAIN, WEB_ORIGIN and MONGODB_URI in .env first (MongoDB Atlas or DigitalOcean Managed MongoDB).
# To run MongoDB on the same Droplet instead:  docker compose --profile localdb up -d --build
# and set MONGODB_URI=mongodb://mongo:27017/sceneos
services:
  api:
    build: { context: ., dockerfile: deploy/api.Dockerfile }
    env_file: .env
    environment: { NODE_ENV: production, REDIS_URL: redis://redis:6379 }
    volumes: [media:/data/media]
    depends_on: [redis]
    restart: unless-stopped

  worker:
    build: { context: ., dockerfile: deploy/api.Dockerfile }
    command: ["node", "dist/worker.js"]
    env_file: .env
    environment: { NODE_ENV: production, REDIS_URL: redis://redis:6379 }
    volumes: [media:/data/media]
    depends_on: [redis]
    restart: unless-stopped

  web:
    build: { context: ., dockerfile: deploy/web.Dockerfile, args: { API_URL: http://api:4000 } }
    depends_on: [api]
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes: [redis-data:/data]
    restart: unless-stopped

  # Caddy gets and renews the HTTPS certificate for DOMAIN on its own.
  caddy:
    image: caddy:2-alpine
    ports: ["80:80", "443:443"]
    environment: { DOMAIN: "${DOMAIN:?Set DOMAIN in .env}" }
    volumes: ["./deploy/Caddyfile:/etc/caddy/Caddyfile:ro", "caddy-data:/data", "caddy-config:/config"]
    depends_on: [web, api]
    restart: unless-stopped

  mongo:
    profiles: [localdb]
    image: mongo:7
    volumes: [mongo-data:/data/db]
    restart: unless-stopped

volumes:
  media:
  caddy-data:
  caddy-config:
  redis-data:
  mongo-data:
